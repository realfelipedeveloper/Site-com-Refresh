services:
  mysql:
    image: mysql:8.4
    container_name: abbatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: refresh
      MYSQL_USER: refresh
      MYSQL_PASSWORD: refresh
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u refresh -prefresh --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: abbatech-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: abbatech-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-api
    command: >
      sh -c "npm run prisma:generate -w @abbatech/api
      && npm run prisma:migrate -w @abbatech/api
      && npm run prisma:seed -w @abbatech/api
      && npm run dev -w @abbatech/api"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://refresh:refresh@mysql:3306/refresh
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@abbatech.local}
    ports:
      - "3333:3333"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_dist:/app/apps/api/dist
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  portal:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-portal
    command: npm run dev -w @abbatech/portal
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:3333/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - portal_next:/app/apps/portal/.next
    depends_on:
      api:
        condition: service_started

  refresh:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-refresh
    command: npm run dev -w @abbatech/refresh
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:3333/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3101:3101"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - refresh_next:/app/apps/refresh/.next
    depends_on:
      api:
        condition: service_started

volumes:
  mysql_data:
    external: true
    name: cms_mysql_data
  minio_data:
    external: true
    name: cms_minio_data
  node_modules:
  api_dist:
  portal_next:
  refresh_next:
