services:
  mysql:
    image: mysql:8.4
    container_name: abbatech-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: refresh
      MYSQL_USER: refresh
      MYSQL_PASSWORD: refresh
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u refresh -prefresh --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: abbatech-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: abbatech-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-api
    command: >
      sh -c "npm run prisma:generate -w @abbatech/api
      && node scripts/guard-database-preflight.mjs
      && npm run prisma:migrate -w @abbatech/api
      && npm run prisma:status -w @abbatech/api
      && node scripts/guard-database-identity.mjs
      && npm run prisma:seed -w @abbatech/api
      && node scripts/guard-domain-data-integrity.mjs
      && npm run dev -w @abbatech/api"
    env_file:
      - .env
    environment:
      APP_ENV: development
      EXPECTED_DATABASE_ENVIRONMENT: development
      EXPECTED_DATABASE_NAME: refresh
      ALLOW_DATABASE_IDENTITY_ADOPTION: "true"
      ALLOW_NONSTRICT_MIGRATION_HISTORY: "true"
      CHECK_DATABASE_DDL_PERMISSIONS: "true"
      MYSQL_REQUIRED_MAJOR: "8"
      DB_CONNECT_RETRIES: "30"
      DB_CONNECT_RETRY_DELAY_MS: "2000"
      DATABASE_URL: mysql://refresh:refresh@mysql:3306/refresh
      S3_ENDPOINT: http://minio:9000
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_REFRESH_URL: http://localhost:3101/abbatech/refresh
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
      INTERNAL_API_URL: http://api:3333/api/v1
      CORS_ORIGINS: http://localhost:3100,http://localhost:3101
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_SESSION_IDLE_TTL_MINUTES: "30"
      AUTH_SESSION_ABSOLUTE_TTL_HOURS: "8"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@abbatech.local}
      SMTP_REQUIRE_AUTH: ${SMTP_REQUIRE_AUTH:-}
      REQUIRE_SMTP_FOR_PASSWORD_RESET: ${REQUIRE_SMTP_FOR_PASSWORD_RESET:-true}
    ports:
      - "3333:3333"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3333/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - api_dist:/app/apps/api/dist
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  portal:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-portal
    command: npm run dev -w @abbatech/portal
    env_file:
      - .env
    environment:
      APP_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_REFRESH_URL: http://localhost:3101/abbatech/refresh
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
      INTERNAL_API_URL: http://api:3333/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3100/abbatech/portal').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - portal_next:/app/apps/portal/.next
    depends_on:
      api:
        condition: service_healthy

  refresh:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: abbatech-refresh
    command: npm run dev -w @abbatech/refresh
    env_file:
      - .env
    environment:
      APP_ENV: development
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEXT_PUBLIC_REFRESH_URL: http://localhost:3101/abbatech/refresh
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
      INTERNAL_API_URL: http://api:3333/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3101:3101"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3101/abbatech/refresh').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - refresh_next:/app/apps/refresh/.next
    depends_on:
      api:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles:
      - test
    command: >
      sh -c "npm ci
      && npm run prisma:generate -w @abbatech/api
      && npm run test"
    env_file:
      - .env
    environment:
      APP_ENV: test
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: mysql://refresh:refresh@mysql:3306/refresh
      NEXT_PUBLIC_APP_URL: http://localhost:3100/abbatech/portal
      NEXT_PUBLIC_REFRESH_URL: http://localhost:3101/abbatech/refresh
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
      INTERNAL_API_URL: http://api:3333/api/v1
    volumes:
      - .:/app
      - test_node_modules:/app/node_modules
      - test_api_dist:/app/apps/api/dist
      - test_portal_next:/app/apps/portal/.next
      - test_refresh_next:/app/apps/refresh/.next

volumes:
  mysql_data:
    external: true
    name: cms_mysql_data
  minio_data:
    external: true
    name: cms_minio_data
  node_modules:
  api_dist:
  portal_next:
  refresh_next:
  test_node_modules:
  test_api_dist:
  test_portal_next:
  test_refresh_next:
