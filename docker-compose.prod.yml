x-app-env: &a1
  APP_ENV: ${APP_ENV:-production}
  NODE_ENV: ${NODE_ENV:-production}
  EXPECTED_DATABASE_ENVIRONMENT: ${EXPECTED_DATABASE_ENVIRONMENT:-production}
  EXPECTED_DATABASE_NAME: ${EXPECTED_DATABASE_NAME:-refresh}
  ALLOW_DATABASE_IDENTITY_ADOPTION: ${ALLOW_DATABASE_IDENTITY_ADOPTION:-false}
  ALLOW_NONSTRICT_MIGRATION_HISTORY: ${ALLOW_NONSTRICT_MIGRATION_HISTORY:-false}
  CHECK_DATABASE_DDL_PERMISSIONS: ${CHECK_DATABASE_DDL_PERMISSIONS:-true}
  MYSQL_REQUIRED_MAJOR: ${MYSQL_REQUIRED_MAJOR:-8}
  DB_CONNECT_RETRIES: ${DB_CONNECT_RETRIES:-30}
  DB_CONNECT_RETRY_DELAY_MS: ${DB_CONNECT_RETRY_DELAY_MS:-2000}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-refresh}
  MYSQL_USER: ${MYSQL_USER:-refresh}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in production}
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required in production}
  NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://abbatech.dev.br/abbatech/portal}
  NEXT_PUBLIC_REFRESH_URL: ${NEXT_PUBLIC_REFRESH_URL:-https://abbatech.dev.br/abbatech/refresh}
  NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://abbatech.dev.br/abbatech/api}
  INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:3333/api/v1}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required in production}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required in production}
  COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required in production}
  AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET:-${COOKIE_SECRET:?COOKIE_SECRET is required in production}}
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
  AUTH_SESSION_IDLE_TTL_MINUTES: ${AUTH_SESSION_IDLE_TTL_MINUTES:-30}
  AUTH_SESSION_ABSOLUTE_TTL_HOURS: ${AUTH_SESSION_ABSOLUTE_TTL_HOURS:-8}
  API_PORT: ${API_PORT:-3333}
  CORS_ORIGINS: ${CORS_ORIGINS:-https://abbatech.dev.br}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required in production}
  REQUIRE_SMTP_FOR_PASSWORD_RESET: ${REQUIRE_SMTP_FOR_PASSWORD_RESET:-true}
  SMTP_REQUIRE_AUTH: ${SMTP_REQUIRE_AUTH:-}
  PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
  ALLOW_EMPTY_DATABASE_BOOTSTRAP: ${ALLOW_EMPTY_DATABASE_BOOTSTRAP:-false}
  REQUIRE_DATABASE_DATA: ${REQUIRE_DATABASE_DATA:-true}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in production}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required in production}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required in production}
  LGPD_DPO_NAME: ${LGPD_DPO_NAME}
  LGPD_DPO_EMAIL: ${LGPD_DPO_EMAIL}
  LGPD_RETENTION_DAYS: ${LGPD_RETENTION_DAYS:-365}
  ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required in production}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required in production}
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-refresh}
      MYSQL_USER: ${MYSQL_USER:-refresh}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required in production}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${MYSQL_USER:-refresh} -p${MYSQL_PASSWORD:?MYSQL_PASSWORD is required in production} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required in production}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required in production}
    volumes:
      - minio_prod_data:/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *a1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3333/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default
      - dokploy-network
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-web.rule=Host(`abbatech.dev.br`) && PathPrefix(`/abbatech/api`)
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-web.entrypoints=web
      - traefik.http.services.portal-abbatech-refresh-g4ud9u-3-web.loadbalancer.server.port=3333
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-web.service=portal-abbatech-refresh-g4ud9u-3-web
      - traefik.http.middlewares.stripprefix-portal-abbatech-refresh-g4ud9u-3.stripprefix.prefixes=/abbatech/api
      - traefik.http.middlewares.addprefix-portal-abbatech-refresh-g4ud9u-3.addprefix.prefix=/api/v1
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-web.middlewares=redirect-to-https@file
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-websecure.rule=Host(`abbatech.dev.br`) && PathPrefix(`/abbatech/api`)
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-websecure.entrypoints=websecure
      - traefik.http.services.portal-abbatech-refresh-g4ud9u-3-websecure.loadbalancer.server.port=3333
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-websecure.service=portal-abbatech-refresh-g4ud9u-3-websecure
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-websecure.middlewares=stripprefix-portal-abbatech-refresh-g4ud9u-3,addprefix-portal-abbatech-refresh-g4ud9u-3
      - traefik.http.routers.portal-abbatech-refresh-g4ud9u-3-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://abbatech.dev.br/abbatech/portal}
        NEXT_PUBLIC_REFRESH_URL: ${NEXT_PUBLIC_REFRESH_URL:-https://abbatech.dev.br/abbatech/refresh}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://abbatech.dev.br/abbatech/api}
    restart: unless-stopped
    environment:
      <<: *a1
      INTERNAL_API_URL: http://api:3333/api/v1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/abbatech/portal').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
  refresh:
    build:
      context: .
      dockerfile: apps/refresh/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://abbatech.dev.br/abbatech/portal}
        NEXT_PUBLIC_REFRESH_URL: ${NEXT_PUBLIC_REFRESH_URL:-https://abbatech.dev.br/abbatech/refresh}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://abbatech.dev.br/abbatech/api}
    restart: unless-stopped
    environment:
      <<: *a1
      INTERNAL_API_URL: http://api:3333/api/v1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/abbatech/refresh').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
volumes:
  mysql_prod_data:
    external: true
    name: ${MYSQL_DATA_VOLUME:-portal-abbatech-refresh-g4ud9u_mysql_prod_data}
  minio_prod_data:
    external: true
    name: ${MINIO_DATA_VOLUME:-portal-abbatech-refresh-g4ud9u_minio_prod_data}
networks:
  dokploy-network:
    external: true
