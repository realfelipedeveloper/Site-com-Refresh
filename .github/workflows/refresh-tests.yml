name: Refresh Automated Tests

on:
  pull_request:
    branches:
      - development
      - homologation
      - main
  push:
    branches:
      - "change/**"
      - "feature/**"
      - "fix/**"

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NODE_ENV: test
      APP_ENV: test
      RUN_E2E: "false"
      RUN_SMOKE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Refresh test suite
        run: npm run test:ci
